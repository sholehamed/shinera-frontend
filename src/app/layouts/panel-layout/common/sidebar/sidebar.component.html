<aside
  class="sidebar-area bg-white transition active"
  [ngClass]="{ active: isSidebarToggled() }"
  [class.dark-sidebar]="themeService.isSidebarDarkTheme()"
  [class.hide-sidebar]="themeService.isHideSidebarTheme()"
  [class.component-dark-theme]="themeService.isDarkTheme()"
  [class.right-sidebar]="themeService.isRightSidebarTheme()"
  [class.component-rtl-enabled]="themeService.isRTLEnabledTheme()"
  aria-label="منوی اصلی"
>
  <div class="logo bg-white">
    <a routerLink="/app/dashboard" class="d-flex align-items-center position-relative">
      <img width="52" height="52" src="shinera-dark-logo.png" alt="Shinera" />
      <span class="fw-bold text-black lh-1 transition position-relative">
        {{ workspace.activeTenant()?.name ?? 'Shinera' }}
      </span>
    </a>
  </div>

  <button
    type="button"
    class="burger-menu transition"
    [ngClass]="{ active: isSidebarToggled() }"
    (click)="toggle()"
    aria-label="باز و بسته کردن منو"
  >
    <span class="top-bar transition d-block bg-black"></span>
    <span class="middle-bar transition d-block bg-black"></span>
    <span class="bottom-bar transition d-block bg-black"></span>
  </button>

  <ng-scrollbar visibility="hover">
    <nav class="sidebar-inner">
      @for (section of menuSections; track section.title) {
        <div class="sidebar-menu">
          <span class="sub-title d-block fw-medium">{{ section.title }}</span>

          @for (item of section.items; track item.title) {
            <a
              [routerLink]="item.route"
              class="sidebar-menu-link"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
            >
              <i class="material-symbols-outlined" aria-hidden="true">{{ item.icon }}</i>
              <span class="title">{{ item.title }}</span>
            </a>
          }
        </div>
      }
    </nav>
  </ng-scrollbar>
</aside>

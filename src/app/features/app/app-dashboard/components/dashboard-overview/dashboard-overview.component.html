<mat-card
    class="dashboard-overview-card mb-25 border-radius d-block bg-white border-0 shadow-none"
    [class.component-rtl-enabled]="themeService.isRTLEnabledTheme()"
    [class.component-dark-theme]="themeService.isDarkTheme()"
>

    <mat-card-content>

        <div class="overview-grid">

            @for (metric of data.metrics; track metric.key) {

                <div class="overview-item">

                    <div class="metric-content">

                        <span class="metric-title d-block">
                            {{ metric.title }}
                        </span>

                        <h5 class="metric-value mb-0">
                            {{ formatValue(metric) }}
                        </h5>

                        <div class="metric-footer">

                            <span
                                class="trend-badge"
                                [class.up]="metric.trend === 'up'"
                                [class.down]="metric.trend === 'down'"
                                [class.neutral]="metric.trend === 'neutral'"
                            >

                                @if (metric.trend === 'up') {
                                    ↑
                                }

                                @if (metric.trend === 'down') {
                                    ↓
                                }

                                {{ formatPercent(metric.changePercent) }}

                            </span>

                            <span class="comparison">
                                {{ metric.comparisonText }}
                            </span>

                        </div>

                        @if (metric.detail) {

                            <div class="metric-detail">
                                {{ metric.detail }}
                            </div>

                        }

                    </div>


                    <div class="chart">

                        <div
                            class="chart-container"
                            [id]="'dashboard_' + metric.key + '_chart'"
                        ></div>

                    </div>

                </div>

            }

        </div>

    </mat-card-content>

</mat-card>

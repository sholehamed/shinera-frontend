<div dir="rtl" class="sign-in-area" [class.dark-theme]="themeService.isDarkTheme()">
  <div class="page-glow page-glow-one"></div>
  <div class="page-glow page-glow-two"></div>

  <div
    class="shinera-auth"
    [class.component-dark-theme]="themeService.isDarkTheme()"
    [class.component-rtl-enabled]="themeService.isRTLEnabledTheme()"
  >
    <div class="auth-card">
      <div class="form-panel">
        <div class="form-content">
          <div class="logo-wrapper">
            <img src="shinera-light-logo.png" class="light-logo" alt="Shinera" />
            <img src="shinera-dark-logo.png" class="dark-logo" alt="Shinera" />
          </div>

          <div class="title">
            <h1>ورود به حساب کاربری</h1>
            <p>اطلاعات حساب خود را برای ادامه وارد کنید.</p>
          </div>

          <form [formGroup]="loginForm" (ngSubmit)="submit()" novalidate>
            <div class="field-wrapper">
              <app-custom-input
                type="text"
                label="ایمیل یا نام کاربری"
                placeholder="ایمیل یا نام کاربری خود را وارد کنید"
                [dir]="'rtl'"
                controlName="username"
              />
            </div>

            <div class="field-wrapper">
              <app-custom-input
                type="password"
                label="رمز عبور"
                placeholder="رمز عبور خود را وارد کنید"
                controlName="password"
              />
            </div>

            <div class="captcha-wrapper">
              <app-captcha
                formControlName="captchaCode"
                (tokenChange)="onCaptchaTokenChange($event)"
              />

              @if (submitted && (!captchaToken || loginForm.controls.captchaCode.invalid)) {
                <mat-error class="captcha-error">کد امنیتی الزامی است.</mat-error>
              }
            </div>

            @if (errorMessage()) {
              <div class="auth-error" role="alert">{{ errorMessage() }}</div>
            }

            <button
              type="submit"
              mat-button
              class="login-button"
              [disabled]="loading()"
              [attr.aria-busy]="loading()"
            >
              <span>{{ loading() ? 'در حال ورود...' : 'ورود' }}</span>
              <i class="material-symbols-outlined">arrow_back</i>
            </button>

            <div class="register-area">
              <span>حساب کاربری ندارید؟</span>
              <a routerLink="/register" class="register-link">ثبت‌نام</a>
            </div>
          </form>
        </div>
      </div>

      <div class="visual-panel" aria-hidden="true">
        <div class="visual-grid"></div>
        <div class="visual-orb orb-one"></div>
        <div class="visual-orb orb-two"></div>
        <div class="visual-orb orb-three"></div>
        <div class="visual-line line-one"></div>
        <div class="visual-line line-two"></div>
        <div class="visual-center">
          <div class="brand-halo halo-one"></div>
          <div class="brand-halo halo-two"></div>
          <div class="brand-mark">
            <div class="brand-mark-glow"></div>
            <img src="shinera-dark-logo.png" alt="" />
          </div>
        </div>
        <div class="visual-dot dot-one"></div>
        <div class="visual-dot dot-two"></div>
        <div class="visual-dot dot-three"></div>
        <div class="visual-dot dot-four"></div>
      </div>
    </div>
  </div>
</div>

<div
  class="navbar-area transition"
  [ngClass]="{ sticky: isSticky }"
  [class.component-dark-theme]="themeService.isDarkTheme()"
  [class.component-rtl-enabled]="themeService.isRTLEnabledTheme()"
>
  <div class="container">
    <nav class="navbar navbar-expand-lg" [class.active]="classApplied">
      <!-- =====================================================
                 Logo
            ====================================================== -->

      <a class="navbar-brand" routerLink="/" (click)="closeMenu()">
        <img class="logo-light" src="shinera-light-logo.png" alt="Shinera" />

        <img class="logo-dark" src="shinera-dark-logo.png" alt="Shinera" />
      </a>

      <!-- =====================================================
                 Mobile Toggle
            ====================================================== -->

      <button
        class="navbar-toggler"
        type="button"
        [class.active]="classApplied"
        (click)="toggleClass()"
        [attr.aria-expanded]="classApplied"
        aria-label="باز کردن منو"
      >
        <span class="burger-menu">
          <span class="top-bar"></span>
          <span class="middle-bar"></span>
          <span class="bottom-bar"></span>
        </span>
      </button>

      <!-- =====================================================
                 Navigation
            ====================================================== -->

      <div class="navbar-collapse" [class.mobile-open]="classApplied">
        <!-- =================================================
                     Navigation
                ================================================== -->

        <div class="mobile-nav-grid">
          <!-- خدمات -->

          <a
            href="#"
            class="mobile-nav-card"
            (click)="scrollToSection('services', $event)"
            (click)="closeMenu()"
          >
            <span class="mobile-nav-icon">
              <i class="material-symbols-outlined"> spa </i>
            </span>

            <span class="mobile-nav-content">
              <strong> خدمات </strong>

              <small> خدمات قابل ارائه </small>
            </span>

            <i class="material-symbols-outlined mobile-arrow"> arrow_back </i>
          </a>

          <!-- نمونه کارها -->

          <a href="#" class="mobile-nav-card" (click)="scrollToSection('gallery', $event)">
            <span class="mobile-nav-icon">
              <i class="material-symbols-outlined"> photo_library </i>
            </span>

            <span class="mobile-nav-content">
              <strong> نمونه‌کارها </strong>

              <small> گالری تصاویر </small>
            </span>

            <i class="material-symbols-outlined mobile-arrow"> arrow_back </i>
          </a>

          <!-- درباره ما -->

          <a href="#about" class="mobile-nav-card"     (click)="scrollToSection('about', $event)"
>
            <span class="mobile-nav-icon">
              <i class="material-symbols-outlined"> person </i>
            </span>

            <span class="mobile-nav-content">
              <strong> درباره ما </strong>

              <small> آشنایی با مجموعه </small>
            </span>

            <i class="material-symbols-outlined mobile-arrow"> arrow_back </i>
          </a>

          <!-- ساعات کاری و موقعیت -->

          <a href="#location" class="mobile-nav-card"     (click)="scrollToSection('location', $event)"
>
            <span class="mobile-nav-icon">
              <i class="material-symbols-outlined"> location_on </i>
            </span>

            <span class="mobile-nav-content">
              <strong> ساعات و موقعیت </strong>

              <small> زمان کاری و آدرس </small>
            </span>

            <i class="material-symbols-outlined mobile-arrow"> arrow_back </i>
          </a>

          <!-- ارتباط با ما -->

          <a href="#contact" class="mobile-nav-card"     (click)="scrollToSection('contact', $event)"
>
            <span class="mobile-nav-icon">
              <i class="material-symbols-outlined"> contact_page </i>
            </span>

            <span class="mobile-nav-content">
              <strong> ارتباط با ما </strong>

              <small> راه‌های ارتباطی </small>
            </span>

            <i class="material-symbols-outlined mobile-arrow"> arrow_back </i>
          </a>
        </div>

        <!-- =================================================
                     Actions
                ================================================== -->

        <div class="mobile-menu-actions">
          <!-- Theme -->

          <button
            type="button"
            class="theme-toggle"
            mat-icon-button
            [attr.aria-label]="
              themeService.isDarkTheme() ? 'فعال کردن حالت روشن' : 'فعال کردن حالت تاریک'
            "
            (click)="toggleTheme()"
          >
            <i class="material-symbols-outlined">
              {{ themeService.isDarkTheme() ? 'light_mode' : 'dark_mode' }}
            </i>
          </button>

          <!-- Phone -->

          <a href="tel:02112345678" mat-button class="login-button" (click)="closeMenu()">
            <i class="material-symbols-outlined"> call </i>

            تماس
          </a>

          <!-- Booking -->
 <a
                        routerLink="auth/login"
                        mat-button
                        class="login-button"
                    >
                        ورود
                    </a>
          <a [routerLink]="['booking']" mat-button class="register-button" >
            دریافت نوبت

            <i class="material-symbols-outlined"> arrow_back </i>
          </a>
        </div>
      </div>
    </nav>
  </div>
</div>

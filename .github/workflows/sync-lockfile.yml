name: sync-lockfile

on:
  push:
    branches:
      - audit/frontend-baseline-alignment
    paths:
      - package.json
      - .github/workflows/sync-lockfile.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: audit/frontend-baseline-alignment

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22.22.3"

      - name: Regenerate package lock
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts

      - name: Commit package lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: sync security override lockfile"
          git push
